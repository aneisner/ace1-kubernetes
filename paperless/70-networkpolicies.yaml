# 1. Grundsatz: Eingehender Verkehr im Namespace ist verboten
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: paperless
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# 2. Postgres: nur Paperless und der Backup-Job
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-from-paperless-and-backup
  namespace: paperless
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: paperless
        - podSelector:
            matchLabels:
              app: postgres-backup
      ports:
        - protocol: TCP
          port: 5432
---
# 3. Redis: nur Paperless
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-from-paperless
  namespace: paperless
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: paperless
      ports:
        - protocol: TCP
          port: 6379
---
# 4. Paperless: nur Traefik darf die Weboberfläche aufrufen
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-paperless-from-traefik
  namespace: paperless
spec:
  podSelector:
    matchLabels:
      app: paperless
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8000
