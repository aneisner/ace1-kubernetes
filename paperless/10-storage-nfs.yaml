apiVersion: v1
kind: PersistentVolume
metadata:
  name: paperless-media
spec:
  capacity:
    storage: 200Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-nas
  mountOptions:
    - nfsvers=3
    - hard
  nfs:
    server: 192.168.88.106
    path: /volume1/paperless/media
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: paperless-consume
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-nas
  mountOptions:
    - nfsvers=3
    - hard
  nfs:
    server: 192.168.88.106
    path: /volume1/paperless/consume
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-media
  namespace: paperless
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-nas
  volumeName: paperless-media
  resources:
    requests:
      storage: 200Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-consume
  namespace: paperless
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-nas
  volumeName: paperless-consume
  resources:
    requests:
      storage: 10Gi
