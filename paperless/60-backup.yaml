apiVersion: v1
kind: PersistentVolume
metadata:
  name: paperless-backup
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-nas
  mountOptions:
    - nfsvers=3
    - hard
  nfs:
    server: 192.168.88.106
    path: /volume1/paperless/backup
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-backup
  namespace: paperless
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-nas
  volumeName: paperless-backup
  resources:
    requests:
      storage: 50Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: paperless
spec:
  schedule: "0 3 * * *"
  timeZone: Europe/Berlin
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: postgres-backup
        spec:
          restartPolicy: OnFailure
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
          containers:
            - name: dump
              image: postgres:17-alpine
              command:
                - sh
                - -c
                - |
                  set -e
                  F=/backup/paperless-$(date +%Y%m%d-%H%M%S).dump
                  echo "Start $(date -u)"
                  i=0
                  until pg_dump -h postgres -U paperless -Fc paperless > "$F.tmp" 2> /tmp/err; do
                    i=$((i+1))
                    echo "Versuch $i fehlgeschlagen:"
                    cat /tmp/err
                    rm -f "$F.tmp"
                    if [ "$i" -ge 5 ]; then exit 1; fi
                    sleep 5
                  done
                  mv "$F.tmp" "$F"
                  find /backup -name 'paperless-*.dump' -mtime +14 -delete
                  find /backup -name 'paperless-*.dump.tmp' -mmin +60 -delete
                  ls -lh /backup
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: POSTGRES_PASSWORD
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: paperless-backup
